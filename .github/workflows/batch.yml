name: batch

# One job per video: build the spec, render, QA, optionally upload as a scheduled private video (docs/SPEC.md section 9).
# Dispatch only; nothing runs on a schedule. Scripts and analysis are committed, so no job calls an LLM or Stockfish.
on:
  workflow_call:
    inputs:
      batch_id:
        required: true
        type: string
      video_ids:
        required: true
        type: string
      upload:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      batch_id:
        description: "Batch name, e.g. batch-0"
        required: true
        type: string
      video_ids:
        description: 'JSON list of video ids, e.g. ["cc-2026-0001-en","cc-2026-0001-hi"]'
        required: true
        type: string
      upload:
        description: "Upload as scheduled private videos after QA passes"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare-upload:
    if: inputs.upload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: youtube-playlists
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e pipeline
      - name: Verify Fish Audio access without synthesizing audio
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: |
          python - <<'PY'
          from chesscode.tts.fish import check_access, MODEL
          check_access()
          print(f'Fish Audio access verified; model={MODEL}')
          PY
      - name: Verify channel and resolve playlists
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m chesscode auth check
          python -m chesscode upload --create-playlists
      - uses: actions/upload-artifact@v4
        with:
          name: upload-config
          path: config/youtube.yaml
          retention-days: 30
  video:
    needs: prepare-upload
    if: ${{ !cancelled() && (needs.prepare-upload.result == 'success' || needs.prepare-upload.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    concurrency:
      group: video-${{ matrix.video_id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        video_id: ${{ fromJson(inputs.video_ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: inputs.upload
        with:
          name: upload-config
          path: config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pipeline
        run: pip install -e pipeline
      # node_modules also holds Remotion's Chrome Headless Shell (node_modules/.remotion), so one entry covers both.
      - name: Cache node_modules and Chrome Headless Shell
        id: node-cache
        uses: actions/cache@v4
        with:
          path: remotion/node_modules
          key: remotion-${{ runner.os }}-${{ hashFiles('remotion/package-lock.json') }}
      - name: Cache TTS audio
        id: tts-cache
        uses: actions/cache/restore@v4
        with:
          path: data/tts_cache
          key: tts-${{ matrix.video_id }}-${{ hashFiles('content/scripts/**', 'config/models.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tts-${{ matrix.video_id }}-${{ hashFiles('content/scripts/**', 'config/models.yaml') }}-
            tts-${{ matrix.video_id }}-
      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm ci
        if: steps.node-cache.outputs.cache-hit != 'true'
      - name: Linux libraries for Chrome (Ubuntu 24.04)
        run: >
          sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64
          libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2t64
      - name: Ensure Chrome Headless Shell
        working-directory: remotion
        run: npx remotion browser ensure
      - name: YouTube auth check
        if: inputs.upload
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m chesscode auth check
      - name: Render, QA and upload
        env:
          VIDEO_ID: ${{ matrix.video_id }}
          BATCH_ID: ${{ inputs.batch_id }}
          UPLOAD: ${{ inputs.upload }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m chesscode batch --video "$VIDEO_ID" --batch-id "$BATCH_ID" $([ "$UPLOAD" = "true" ] && echo --upload)
      - name: Preserve completed voice segments even after a later failure
        if: always() && hashFiles('data/tts_cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: data/tts_cache
          key: ${{ steps.tts-cache.outputs.cache-primary-key }}
      # Small files only (public repo): never the MP4.
      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.video_id }}
          path: |
            build/specs/${{ matrix.video_id }}/result.json
            build/specs/${{ matrix.video_id }}/qa.json
            build/specs/${{ matrix.video_id }}/video_spec.json
            build/specs/${{ matrix.video_id }}/thumb.png
            build/specs/${{ matrix.video_id }}/thumb_320.png
            build/specs/${{ matrix.video_id }}/contact.jpg
          if-no-files-found: ignore
          retention-days: 30

  verify-upload:
    needs: video
    if: ${{ !cancelled() && inputs.upload }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e pipeline
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: collected
      - name: Collect upload ledger
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m chesscode ledger collect --artifacts collected --run-url "$RUN_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify actual YouTube ids, privacy and publication times
        env:
          VIDEO_IDS: ${{ inputs.video_ids }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from chesscode.auth import youtube_client
          from chesscode.ledger import read_ledger
          rows = read_ledger(Path('data/upload_log.csv'))
          results = [json.loads(p.read_text(encoding='utf-8')) for p in Path('collected').glob('*/result.json')]
          assert not any(r.get('needs_repair') for r in results), 'Thumbnail or playlist follow-up requires repair'
          expected = json.loads(os.environ['VIDEO_IDS'])
          assert set(expected) <= set(rows), 'Missing video results; uploads are incomplete'
          assert all(rows[v]['status'] == 'scheduled' and rows[v]['qa_passed'] == 'true' for v in expected), 'One or more videos failed QA or upload'
          ids = [rows[v]['youtube_id'] for v in expected]
          assert all(ids) and len(set(ids)) == len(ids), 'Missing or duplicated YouTube ids'
          response = youtube_client().videos().list(part='snippet,status', id=','.join(ids)).execute()
          live = {v['id']: v for v in response.get('items', [])}
          verified = []
          for video in expected:
              row = rows[video]
              assert row['youtube_id'] in live, f'{video}: not found on YouTube'
              item = live[row['youtube_id']]
              status = item['status']
              assert status.get('privacyStatus') == 'private', f'{video}: not private'
              assert status.get('uploadStatus') in ('uploaded', 'processed'), f'{video}: upload rejected or failed'
              assert datetime.fromisoformat(status.get('publishAt', '').replace('Z', '+00:00')) == datetime.fromisoformat(row['publish_at'].replace('Z', '+00:00')), f'{video}: publication time mismatch'
              assert f'ccid: {video}' in item['snippet']['description'].splitlines(), f'{video}: ccid mismatch'
              verified.append({'video_id': video, 'youtube_id': item['id'], 'privacy': status['privacyStatus'], 'publish_at': status['publishAt'], 'title': item['snippet']['title']})
          Path('build').mkdir(exist_ok=True)
          Path('build/upload-verification.json').write_text(json.dumps(verified, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'Verified {len(verified)} scheduled private uploads against YouTube')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upload-ledger
          path: |
            data/upload_log.csv
            docs/review/
            build/upload-verification.json
          retention-days: 30
