name: Render timing

# Branch-only entry point for the unmerged batch workflow.
on:
  workflow_dispatch:
    inputs:
      batch_id:
        required: true
        type: string
      video_ids:
        required: true
        type: string
      upload:
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  batch:
    uses: ./.github/workflows/batch.yml
    with:
      batch_id: ${{ inputs.batch_id }}
      video_ids: ${{ inputs.video_ids }}
      upload: ${{ inputs.upload }}
    secrets: inherit
