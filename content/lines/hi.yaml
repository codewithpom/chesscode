# Pyaada line bank, Hindi (spec section 8). Fallback when a script-written line breaks the joke rules.
# beat_type -> lines. Max 10 words (counted with str.split). Spoken Hindi, written natively (not translated);
# chess terms stay English in Latin script. About the move, never the player.
# Running gags (<= 5 per beat): wants promotion; distrusts the h-pawn; every rook lift is "too aggressive".
# Draft: 28 per beat so the owner can drop a few and keep >= 25.

